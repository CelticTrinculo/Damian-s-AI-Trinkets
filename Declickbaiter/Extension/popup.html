<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeClickbait Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            zoom: 1.15;
            background-color: #1d1f27;
            color: #eaeaea;
            font-family: 'Arial', sans-serif;
            max-width: 400px !important;
            min-width: 400px !important;
            width: 100% !important;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background-color: #282c34;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h3 {
            text-align: center;
            color: #00bfa6;
        }

        #summarizingArticleFrom {
            font-size: 0.8rem;
            color: #00bfa6;
            text-align: center;
        }

        .form-control {
            background-color: #343a40;
            color: #eaeaea;
            border: 1px solid #00bfa6;
        }

        .form-control:focus {
            background-color: #343a40;
            color: #eaeaea;
            border: 1px solid #00bfa6;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #00bfa6;
            border: none;
        }

        .btn-primary:hover {
            background-color: #00a890;
        }

        textarea {
            resize: none;
            font-family: monospace;
            font-size: 1rem;
            height: 300px;
            overflow-y: visible !important;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #00bfa6 !important;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background-color: #282c34 !important;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #00a890 !important;
        }

        ::-webkit-scrollbar-button {
            display: none;
        }

        textarea::-webkit-scrollbar-corner {
            display: none;
        }

        #loading {
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>DeClickbait Assistant</h3>
        <p class="text-center">Click the button below to summarize this page:</p>
        <button id="summarize" class="btn btn-primary w-100">Summarize</button>
        <p class="mt-3" id="summarizingArticleFrom">Summarizing article from <span id="summarizingArticleFromWebsite"></span></p>
        <textarea id="result" class="form-control mt-3" readonly placeholder="Summary will appear here..."></textarea>
    </div>
    <script src="popup.js"></script>
</body>

</html>
